name: Continuous Deployment Pipeline

on:
  push:
    branches:
      - main

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  REGISTRY_NAME: acrgraphadmincli2026
  IMAGE_NAME: graph-admin-cli

jobs:
  deploy:
    name: Continuous Deployment & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      #ACR Registry Authentication
      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: Log into Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.ARM_CLIENT_ID }}
          password: ${{ secrets.ARM_CLIENT_SECRET }}

      #Container Build & Push Pipeline
      - name: Build and Push Container Image
        run: |
          REGISTRY_URI="${{ env.REGISTRY_NAME }}.azurecr.io"
          IMAGE_URI="${REGISTRY_URI}/${{ env.IMAGE_NAME }}"
          COMMIT_SHA="${{ github.sha }}"

          # Build image tagged with Git SHA and 'latest'
          docker build \
            -t ${IMAGE_URI}:${COMMIT_SHA} \
            -t ${IMAGE_URI}:latest .

          # Push both tags to ACR
          docker push ${IMAGE_URI}:${COMMIT_SHA}
          docker push ${IMAGE_URI}:latest

      #Automated Infrastructure Config
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      #Deployment Verification & Health Check
      - name: Deployment Health Check (Smoke Test)
        run: |
          REGISTRY_URI="${{ env.REGISTRY_NAME }}.azurecr.io"
          IMAGE_TAG="${REGISTRY_URI}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          echo "Pulling published image from ACR: ${IMAGE_TAG}"
          docker pull ${IMAGE_TAG}

          echo "Testing non-root execution and entrypoint startup..."
          docker run --rm ${IMAGE_TAG} --help